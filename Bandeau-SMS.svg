<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="SMS SimMathsSciences : simulations de maths et sciences pour 3PM, CAP et Bac Pro">
  <title>SMS — SimMathsSciences</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2550"/><stop offset="1" stop-color="#0a0e27"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="phGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3860"/><stop offset=".25" stop-color="#ff8c00"/>
      <stop offset=".5" stop-color="#ffe600"/><stop offset=".75" stop-color="#39ff14"/>
      <stop offset="1" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="heatGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3860"/><stop offset="1" stop-color="#ff8c00"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="rgba(0,240,255,0.05)"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffe600"/>
    </marker>
  </defs>

  <style>
    .sec { font: 800 12px 'Segoe UI', system-ui, sans-serif; letter-spacing: 3px; text-anchor: middle; }
    .sig { font: 600 10px 'Segoe UI', system-ui, sans-serif; fill: #8f97a8; text-anchor: end; }
    .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.1s ease-in-out infinite alternate; }
    @keyframes flick { from { transform: scale(1); } to { transform: scale(1.07) translateY(-1px); } }
    .bub { animation: rise 2.4s ease-in infinite; }
    .bub.b2 { animation-delay: 1.2s; }
    @keyframes rise { from { transform: translateY(0); opacity: .9; } to { transform: translateY(-14px); opacity: 0; } }
    .tan { stroke-dasharray: 6 4; animation: dash 1.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -20; } }
    .phPtr { animation: sway 3.5s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
  </style>

  <rect width="1200" height="260" fill="url(#bgGrad)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>

  <!-- ══ LOGO ══ -->
  <g transform="translate(24,30)">
    <path d="M14,0 h96 a14,14 0 0 1 14,14 v40 a14,14 0 0 1 -14,14 h-58 l-24,20 v-20 h-14 a14,14 0 0 1 -14,-14 v-40 a14,14 0 0 1 14,-14 z"
          fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)"/>
    <path d="M34,38 l12,16 l20,-34 l4,0" fill="none" stroke="#ffe600" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <line x1="66" y1="18" x2="96" y2="18" stroke="#ffe600" stroke-width="2"/>
    <text x="140" y="42" font-family="'Segoe UI', system-ui" font-size="44" font-weight="900" letter-spacing="2" fill="url(#titleGrad)" filter="url(#glow)">SMS</text>
    <text x="142" y="66" font-family="'Segoe UI', system-ui" font-size="15" font-weight="700" fill="#f0f4ff">SimMathsSciences</text>
    <text x="142" y="88" font-family="'Segoe UI', system-ui" font-size="12" fill="#a8b2d1">3PM • CAP • Bac Pro</text>
  </g>

  <line x1="318" y1="60" x2="318" y2="200" stroke="rgba(255,255,255,0.12)"/>
  <line x1="612" y1="60" x2="612" y2="200" stroke="rgba(255,255,255,0.12)"/>
  <line x1="906" y1="60" x2="906" y2="200" stroke="rgba(255,255,255,0.12)"/>

  <!-- ══ MATHS ══ -->
  <text class="sec" x="465" y="70" fill="#00f0ff">MATHS</text>

  <g transform="translate(385,130)">
    <rect x="-22" y="-22" width="44" height="44" rx="9" fill="none" stroke="#00f0ff" stroke-width="2"/>
    <g fill="#00f0ff">
      <circle cx="-10" cy="-10" r="3.5"/><circle cx="10" cy="-10" r="3.5"/><circle cx="0" cy="0" r="3.5"/>
      <circle cx="-10" cy="10" r="3.5"/><circle cx="10" cy="10" r="3.5"/>
    </g>
  </g>

  <!-- Courbe + tangente VRAIE : parabole Q(-28,16 / 0,-24 / 28,16),
       point de contact B(0.3) = (-11.2 ; -0.8), pente B'(0.3) = -32/56 -->
  <g transform="translate(465,130)" fill="none" stroke-width="2">
    <path d="M-28,16 Q0,-24 28,16" stroke="#00f0ff"/>
    <line class="tan" x1="-27.2" y1="8.3" x2="4.8" y2="-9.9" stroke="#ffe600"/>
    <circle cx="-11.2" cy="-0.8" r="3.5" fill="#ff2bd6" stroke="none"/>
  </g>

  <g transform="translate(545,130)" fill="none" stroke="#00f0ff" stroke-width="2">
    <path d="M-24,20 L24,20 L8,-20 Z"/>
    <path d="M-10,20 A 14 14 0 0 0 -16,9"/>
    <circle cx="8" cy="-20" r="5"/>
  </g>

  <!-- ══ SCIENCES ══ -->
  <text class="sec" x="759" y="70" fill="#ff2bd6">SCIENCES</text>

  <g transform="translate(679,128)">
    <path d="M-6,-26 L-6,-6 L-20,18 Q-23,24 -16,24 L16,24 Q23,24 20,18 L6,-6 L6,-26" fill="none" stroke="#ff2bd6" stroke-width="2"/>
    <line x1="-9" y1="-26" x2="9" y2="-26" stroke="#ff2bd6" stroke-width="2"/>
    <path d="M-13,10 L13,10 L17,19 Q18,22 15,22 L-15,22 Q-18,22 -17,19 Z" fill="#ff2bd6" opacity=".45"/>
    <circle class="bub" cx="-4" cy="4" r="2.2" fill="#ff2bd6"/>
    <circle class="bub b2" cx="5" cy="6" r="1.6" fill="#ff2bd6"/>
  </g>

  <g transform="translate(759,128)">
    <rect x="-30" y="-8" width="60" height="14" rx="7" fill="url(#phGrad)"/>
    <g stroke="#0a0e27" stroke-width="1.5">
      <line x1="-15" y1="-8" x2="-15" y2="6"/><line x1="0" y1="-8" x2="0" y2="6"/><line x1="15" y1="-8" x2="15" y2="6"/>
    </g>
    <g font-family="'Segoe UI', system-ui" font-size="9" fill="#a8b2d1" text-anchor="middle">
      <text x="-30" y="20">0</text><text x="0" y="20">7</text><text x="30" y="20">14</text>
    </g>
    <path class="phPtr" d="M0,-12 l5,-8 h-10 z" fill="#f0f4ff"/>
  </g>

  <g transform="translate(839,128)">
    <rect x="-5" y="-26" width="10" height="40" rx="5" fill="none" stroke="#ff8c00" stroke-width="2"/>
    <circle cx="0" cy="20" r="8" fill="url(#heatGrad)"/>
    <rect x="-2" y="-12" width="4" height="30" rx="2" fill="url(#heatGrad)"/>
    <path d="M12,-18 q4,5 0,10 q-4,5 0,10" fill="none" stroke="#ff8c00" stroke-width="1.6" opacity=".7"/>
    <path d="M18,-14 q3,4 0,8 q-3,4 0,8" fill="none" stroke="#ff8c00" stroke-width="1.4" opacity=".5"/>
  </g>

  <!-- ══ CO-INTERVENTION ══ -->
  <text class="sec" x="1053" y="70" fill="#ffe600">CO-INTERVENTION</text>

  <g transform="translate(973,128)">
    <path class="flame" d="M0,-24 C8,-12 15,-5 15,6 C15,15 8,23 0,23 C-8,23 -15,15 -15,6 C-15,-2 -9,-8 -6,-15 C-4,-9 3,-10 0,-24 Z"
          fill="none" stroke="#ff3860" stroke-width="2.2" filter="url(#glow)"/>
    <path d="M0,-6 C4,-1 7,2 7,7 C7,12 4,15 0,15 C-4,15 -7,12 -7,7 C-7,3 -3,0 0,-6 Z" fill="#ff8c00" opacity=".8"/>
  </g>

  <g transform="translate(1053,128)" fill="none" stroke="#39ff14" stroke-width="2">
    <rect x="-24" y="-22" width="48" height="44" rx="6"/>
    <rect x="6" y="-12" width="14" height="26"/>
    <circle cx="-9" cy="-9" r="4" fill="#39ff14" stroke="none"/>
    <path d="M-9,-4 L-9,6 M-9,-2 L-2,-7 M-9,1 L-3,3 M-9,6 L-14,16 M-9,6 L-4,16"/>
  </g>

  <g transform="translate(1133,128)">
    <g fill="none" stroke="#ffe600" stroke-width="2">
      <circle cx="-14" cy="-8" r="4" fill="#ffe600" stroke="none"/>
      <path d="M-21,6 Q-14,-4 -7,6"/>
      <circle cx="0" cy="-12" r="4" fill="#ffe600" stroke="none"/>
      <path d="M-7,2 Q0,-8 7,2"/>
      <circle cx="14" cy="-8" r="4" fill="#ffe600" stroke="none"/>
      <path d="M7,6 Q14,-4 21,6"/>
    </g>
    <line x1="-20" y1="16" x2="16" y2="16" stroke="#ffe600" stroke-width="2" marker-end="url(#arrY)"/>
  </g>

  <!-- ══ SIGNATURE ══ -->
  <text class="sig" x="1180" y="248">Auteurs : J-P Pommier + IA • CC BY-NC-SA 4.0 • 2024–2026</text>
</svg>
